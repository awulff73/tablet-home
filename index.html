<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Home</title>
<style>
  /* ============ SETTINGS: edit these ============ */
  :root {
    --accent: #6fb3ff;
    --accent2: #8be3b0;
  }
</style>
<script>
  const CONFIG = {
    place: "Madison, AL",
    // Clock always shows this time zone, even if the tablet's own setting is wrong
    timeZone: "America/Chicago",
    lat: 34.6993,
    lon: -86.7483,
    // Night mode dims the screen between these hours (24h clock)
    nightStart: 22,
    nightEnd: 6,
    // Night view during night hours: big dim clock, tonight/tomorrow forecast and the tiles. Tap the clock or weather for the full dashboard.
    // "tablet" = wall tablet only (Fully), true = every screen (fridge too), false = off
    nightView: "tablet",
    // Radar shown when you tap the weather (NWS Huntsville radar, KHTX)
    radarLoop: "https://radar.weather.gov/ridge/standard/KHTX_loop.gif",
    radarInteractive: "https://radar.weather.gov/station/KHTX/standard",
    // Severe weather wake-up (needs Fully PLUS with the JavaScript Interface on)
    // "keepOn": wake and keep the screen on until the alert ends. "once": wake once when it's issued.
    wakeAlerts: {
      "Tornado Warning": "keepOn",
      "Severe Thunderstorm Warning": "keepOn",
      "Tornado Watch": "once"
    },
    // Real screen brightness, 0–255 (needs Fully). Day = sunrise to sunset, evening = sunset to night hours, night = night hours.
    brightness: { day: 200, evening: 110, night: 35 },
    // Cold banner: next night's low at or below "light" (°F) = freeze, at or below "hard" = hard freeze.
    // These plant warnings only show in the "seasons" (MM-DD ranges: spring and fall), not all winter.
    // "pipes": any time of year, a low at or below this shows a very-cold banner to protect pipes (set to null to turn off).
    // NWS Frost Advisory (light blue), Freeze Watch/Warning (blue), Hard Freeze Watch/Warning (dark blue) also show it whenever NWS issues them.
    freeze: { light: 32, hard: 28, seasons: [["03-01", "05-15"], ["10-01", "11-30"]], pipes: 20 },
    // Air quality banner (purple) only when the US AQI reaches this level (101 = "unhealthy for sensitive groups"). null = off.
    airBanner: 101,
    // Trash/recycling reminder, shown from 4 PM the day before until 10 AM pickup day.
    // day: "Sun".."Sat". nth: 2 = second one of the month. holidayDelay: pushed back a day when a holiday falls on these days that week.
    pickups: [
      { label: "Trash", day: "Wed", holidayDelay: ["Mon", "Tue", "Wed"] },
      { label: "Recycling", day: "Fri", nth: 2 }
    ],
    // National holidays that delay pickup (remove any your hauler works through)
    holidays: ["New Year's Day", "MLK Day", "Presidents Day", "Memorial Day", "Juneteenth", "Independence Day", "Labor Day", "Columbus Day", "Veterans Day", "Thanksgiving", "Christmas"],
    pickupRemind: { eveningFrom: 16, morningUntil: 10 },
    // Countdown card under the tiles: the next few holidays and family events within daysAhead days.
    // Holidays (calculated automatically): New Year's Day, Valentine's Day, Easter, Mother's Day, Father's Day, Independence Day, Thanksgiving, Christmas.
    // Events: date "YYYY-MM-DD" = one time, "MM-DD" = every year. what (optional) is a label for the list; the background shows it (heart = anniversary, cake = birthday). theme: bday, anniv, trip, event, grad (or a holiday look: xmas, thanks, july4, newyear, easter, mom, dad).
    countdowns: {
      show: 3,
      daysAhead: 60,
      holidays: ["New Year's Day", "Valentine's Day", "Easter", "Mother's Day", "Father's Day", "Independence Day", "Thanksgiving", "Christmas"],
      events: [
        { name: "Melissa & Andy", what: "Anniversary", date: "11-13", theme: "anniv" },
        { name: "Whitney & Walton", what: "Anniversary", date: "10-21", theme: "anniv" },
        { name: "Jacob & Katrielle", what: "Anniversary", date: "10-15", theme: "anniv" },
        { name: "Andy's birthday", what: "Birthday", date: "04-18", theme: "bday" },
        { name: "Melissa's birthday", what: "Birthday", date: "07-03", theme: "bday" },
        { name: "Katrielle's birthday", what: "Birthday", date: "08-08", theme: "bday" },
        { name: "Whitney's birthday", what: "Birthday", date: "06-28", theme: "bday" },
        { name: "Jared's birthday", what: "Birthday", date: "01-16", theme: "bday" },
        { name: "Claire's birthday", what: "Birthday", date: "07-15", theme: "bday" },
        { name: "Zachary's birthday", what: "Birthday", date: "10-13", theme: "bday" },
        { name: "Jacob's birthday", what: "Birthday", date: "10-20", theme: "bday" },
        { name: "Walton's birthday", what: "Birthday", date: "10-01", theme: "bday" },
        { name: "Jared's graduation", what: "Graduation", date: "2026-12-14", theme: "grad" }
        // one-time example: { name: "Family trip", date: "2026-12-19", theme: "trip" }
      ]
    },
    // Rain timing line under current conditions: an hour counts as "rain" at this chance (%) or higher; looks this many hours ahead
    rainLine: { chance: 40, hoursAhead: 12 },
    tiles: [
      { label: "Home Controls", sub: "Lights, locks & devices", icon: "home", url: "https://my.smartthings.com/", color: "#2b6cb0" },
      // chrome: true = open this tile in the Chrome app instead of inside Fully (Wyze won't sign in inside Fully). Back returns to this page.
      { label: "Cameras",       sub: "Wyze live view",          icon: "camera", url: "https://my.wyze.com/live",   color: "#2f855a", chrome: true },
      { label: "Thermostat",    sub: "ecobee",                  icon: "thermo", url: "https://www.ecobee.com/login/", color: "#b7791f" },
      { label: "Water",         sub: "Flume",                   icon: "water",  url: "https://portal.flumewater.com/", color: "#0e7490" }
    ]
  };
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    /* Day: deep slate with a soft sky-blue / violet glow in the corners */
    background:
      radial-gradient(circle at 15% 10%, rgba(56,189,248,0.18), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(167,139,250,0.16), transparent 45%),
      #0b1120;
    background-attachment: fixed;
    color: #e8edf4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: filter 2s;
  }
  body.night { filter: brightness(0.45); background: #000; } /* Night (10 PM–6 AM): true black, least light in a dark room */
  body.night .card { background: rgba(255,255,255,0.06); }
  body.night.hwdim { filter: brightness(0.85); } /* the screen itself is dimmed, so only a little extra */

  .wrap {
    height: 100vh; padding: 2.2vmin 2.6vmin;
    display: grid; gap: 2.2vmin;
    grid-template-columns: 1.15fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "clock  tiles"
      "now    tiles"
      "week   week";
    transition: transform 1s;
  }
  .card {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 2.4vmin;
    padding: 2.2vmin 2.6vmin;
  }

  /* Clock */
  .clock { grid-area: clock; padding-top: 0.5vmin; }
  #time { font-size: 19vmin; font-weight: 200; line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  #time .ampm { font-size: 6vmin; font-weight: 400; color: #9fb0c6; margin-left: 1.2vmin; letter-spacing: 0; }
  #date { font-size: 4vmin; color: #b8c6d8; margin-top: 1vmin; }
  #sun { display: flex; flex-wrap: wrap; gap: 0.6vmin 2.4vmin; margin-top: 1vmin; font-size: 2.6vmin; color: #b8c6d8; }
  #sun .si { display: flex; align-items: center; gap: 0.8vmin; white-space: nowrap; transition: opacity 1s; }
  #sun .si b { font-weight: 600; color: #e8edf4; }
  #sun .si.past { opacity: 0.45; }
  #extras { display: flex; flex-wrap: wrap; gap: 0.8vmin; margin-top: 1vmin; }
  #extras:empty { display: none; }
  body.busy #time { font-size: 15vmin; }   /* 3+ chips: shrink the clock so the weather card keeps its room */
  body.busy #date { font-size: 3.4vmin; margin-top: 0.6vmin; }
  body.busy #sun { margin-top: 0.6vmin; }
  .chip { display: flex; align-items: center; gap: 0.8vmin; font-size: 2.1vmin; color: #cfdae8; padding: 0.4vmin 1.3vmin; border-radius: 99px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); white-space: nowrap; }
  .chip i { width: 1.5vmin; height: 1.5vmin; border-radius: 50%; display: inline-block; }

  /* Alerts */
  #alerts { margin-top: 1.6vmin; display: none; }
  .alert {
    background: #7a1d1d; border: 1px solid #c53030; color: #fff;
    border-radius: 1.6vmin; padding: 1.2vmin 1.8vmin; font-size: 2.6vmin; font-weight: 600;
    margin-bottom: 1vmin; display: flex; gap: 1.2vmin; align-items: center;
  }
  .alert.moderate { background: #744210; border-color: #d69e2e; }
  #severe {
    position: fixed; left: 0; right: 0; top: 0; z-index: 70; display: none;
    padding: 1.6vmin 2.6vmin; font-size: 4vmin; font-weight: 800; color: #fff; text-align: center;
    background: #b91c1c; border-bottom: 0.6vmin solid #fecaca; letter-spacing: 0.02em;
    animation: sevPulse 1.6s ease-in-out infinite;
  }
  /* Notice banners across the top (freeze, no connection, unplugged) — they stack */
  #topBars { position: fixed; left: 0; right: 0; top: 0; z-index: 40; }
  #topBars .bar {
    display: none; padding: 1vmin 2.6vmin; font-size: 2.8vmin; font-weight: 700; color: #fff; text-align: center;
    letter-spacing: 0.01em; border-bottom: 0.4vmin solid rgba(255,255,255,0.45);
  }
  #topBars .bar .ic { margin-right: 1vmin; }
  #freezeBar.frost { background: #7dd3fc; color: #0c2d48; border-bottom-color: #0369a1; }  /* frost advisory: light blue */
  #freezeBar.freeze { background: #2563eb; }   /* freeze: medium blue */
  #freezeBar.hard, #freezeBar.pipes { background: #1e3a8a; }     /* hard freeze / very cold: dark blue */
  #trashBar { background: #78350f; }
  #netBar { background: #b45309; }
  #powerBar { background: #9a3412; }
  #powerBar.low { background: #b91c1c; }
  #airBar { background: #6b21a8; }          /* air quality: purple */
  #airBar.bad { background: #86198f; }      /* unhealthy or worse: magenta-purple */
  body.bars-on #time { font-size: 16vmin; }
  body.bars-on.busy #time { font-size: 13.5vmin; }
  body.bars-many #time { font-size: 11vmin; }   /* 2+ banners: keep the weather card from being squeezed */
  body.bars-many #date { font-size: 3vmin; margin-top: 0.4vmin; }
  body.bars-many #sun { margin-top: 0.4vmin; }
  body.bars-many .hour .i { font-size: 3vmin; margin: 0; }
  body.severe-on #topBars { display: none; }
  /* Tornado Warning: pulsing magenta-purple · Severe Thunderstorm Warning: pulsing orange · Tornado Watch: steady red */
  #severe.tornado { background: #a21caf; border-bottom-color: #f5d0fe; animation: torPulse 1.6s ease-in-out infinite; }
  #severe.tstorm { background: #ea580c; border-bottom-color: #fed7aa; animation: tsPulse 1.6s ease-in-out infinite; }
  #severe.watch { background: #b91c1c; border-bottom-color: #fecaca; animation: none; }
  @keyframes torPulse { 50% { background: #581c87; } }
  @keyframes tsPulse { 50% { background: #9a3412; } }
  #severe small { display: block; font-size: 2.4vmin; font-weight: 500; opacity: 0.9; margin-top: 0.4vmin; }
  @keyframes sevPulse { 50% { background: #7f1d1d; } }
  body.severe-on #radar { padding-top: 13vmin; }
  .alert.minor { background: #2c3e50; border-color: #4a6785; }

  /* Current conditions */
  .now { grid-area: now; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; }
  .now-top { display: flex; align-items: center; gap: 2.6vmin; }
  #nowIcon { font-size: 10vmin; line-height: 1; }
  #nowTemp { font-size: 10vmin; font-weight: 300; line-height: 1; }
  #nowTemp sup { font-size: 5vmin; vertical-align: top; }
  #nowText { font-size: 3.4vmin; color: #cfdae8; }
  #nowMeta { font-size: 2.4vmin; color: #8fa1b8; margin-top: 0.6vmin; }
  #nowRain { font-size: 2.5vmin; color: var(--accent); margin-top: 0.8vmin; }
  #nowRain:empty { display: none; }
  #nowRain .ic { margin-right: 0.6vmin; }
  #nowRain.wet { color: #93c5fd; font-weight: 600; }
  .place { font-size: 2.2vmin; color: #7d8ea5; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.6vmin; }
  .hourly { display: flex; gap: 1vmin; margin-top: 1vmin; overflow: hidden; }
  .hour { flex: 1; text-align: center; min-width: 0; }
  .hour .h { font-size: 2vmin; color: #8fa1b8; }
  .hour .i { font-size: 3.6vmin; margin: 0.3vmin 0; }
  .hour .t { font-size: 2.6vmin; font-weight: 600; }
  .hour .p { font-size: 1.8vmin; color: var(--accent); min-height: 2.2vmin; }

  /* Tiles */
  .tiles { grid-area: tiles; display: grid; gap: 2.2vmin; grid-auto-rows: 1fr; }
  .tiles.grid2 { grid-template-columns: 1fr 1fr; }
  .tiles.grid2 .tile { flex-direction: column; justify-content: center; text-align: center; gap: 1.2vmin; padding: 2vmin; }
  .tiles.grid2 .tile .arrow { display: none; }
  .tiles.grid2 .tile .tl { font-size: 4.2vmin; white-space: nowrap; }
  .tiles.grid2 .tile .ts { font-size: 2.2vmin; }
  .tile {
    border-radius: 2.8vmin; border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; gap: 3vmin; padding: 0 4vmin;
    cursor: pointer; position: relative; overflow: hidden;
    color: inherit; text-decoration: none;
    box-shadow: 0 1vmin 3vmin rgba(0,0,0,0.35);
    transition: transform 0.12s, filter 0.12s;
  }
  .tile:active { transform: scale(0.97); filter: brightness(1.2); }
  .tile .ti { font-size: 10vmin; line-height: 1; }
  .tile .tl { font-size: 5vmin; font-weight: 650; }
  .tile .ts { font-size: 2.6vmin; opacity: 0.8; margin-top: 0.5vmin; }
  .tile .arrow { position: absolute; right: 3vmin; font-size: 5vmin; opacity: 0.5; }
  .tile.loading::after {
    content: "Opening…"; position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); font-size: 4vmin; font-weight: 600;
  }

  /* 7-day */
  .week { grid-area: week; display: flex; gap: 1vmin; }
  .day { flex: 1; text-align: center; padding: 1.4vmin 0.6vmin; border-radius: 1.8vmin; min-width: 0; }
  .day.today { background: rgba(111,179,255,0.12); }
  .day .d { font-size: 2.4vmin; color: #b8c6d8; font-weight: 600; }
  .day .i { font-size: 5.4vmin; margin: 0.6vmin 0; }
  .day .t { font-size: 2.6vmin; font-weight: 650; }
  .day .t span { color: #7d8ea5; font-weight: 400; margin-left: 0.6vmin; }
  .day .p { font-size: 1.9vmin; color: var(--accent); min-height: 2.3vmin; }

  .muted { color: #6b7a90; font-size: 2.4vmin; }
  .ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.15em; }
  .ic svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #sun .ic { font-size: 1.25em; }

  /* Tap weather for radar */
  .now, .week { cursor: pointer; position: relative; transition: transform 0.12s, background 0.12s; }
  .now:active, .week:active { transform: scale(0.985); background: rgba(255,255,255,0.08); }
  .radar-hint {
    position: absolute; top: 1.8vmin; right: 2.2vmin;
    font-size: 2.2vmin; font-weight: 600; color: var(--accent);
    background: rgba(111,179,255,0.12); border: 1px solid rgba(111,179,255,0.3);
    border-radius: 99px; padding: 0.5vmin 1.6vmin;
  }

  /* Radar overlay */
  #radar {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: none;
    background: rgba(6,9,14,0.96); flex-direction: column;
    padding: 2vmin 2.6vmin;
  }
  #radar.open { display: flex; }
  .radar-bar { display: flex; align-items: center; gap: 2vmin; margin-bottom: 1.6vmin; }
  .radar-title { font-size: 3.4vmin; font-weight: 650; flex: 1; }
  .radar-title small { display: block; font-size: 2vmin; font-weight: 400; color: #8fa1b8; margin-top: 0.3vmin; }
  .rbtn {
    font: inherit; font-size: 2.6vmin; font-weight: 600; color: #e8edf4; text-decoration: none;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 1.6vmin; padding: 1.4vmin 2.6vmin; cursor: pointer;
  }
  .rbtn.close { background: #2b6cb0; border-color: #4a8fd8; min-width: 16vmin; }
  .radar-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .radar-img img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 1.2vmin; }
  #radarMsg { color: #8fa1b8; font-size: 3vmin; text-align: center; }

  /* Day details (tap a day in the 7-day strip) */
  .day { cursor: pointer; }
  .day:active { background: rgba(255,255,255,0.1); }
  #dayDetail { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 55; display: none; background: rgba(4,7,12,0.82); align-items: center; justify-content: center; padding: 4vmin; }
  #dayDetail.open { display: flex; }
  .dd-card { background: #111a2e; border: 1px solid rgba(255,255,255,0.14); border-radius: 2.6vmin; width: 92vw; width: min(92vw, 150vmin); max-height: 88vh; overflow: auto; padding: 3vmin 3.4vmin; box-shadow: 0 2vmin 6vmin rgba(0,0,0,0.5); }
  .dd-head { display: flex; align-items: center; gap: 2vmin; margin-bottom: 2vmin; }
  .dd-title { flex: 1; font-size: 4.4vmin; font-weight: 700; }
  .dd-part { display: flex; gap: 2.6vmin; padding: 2vmin 0; border-top: 1px solid rgba(255,255,255,0.08); }
  .dd-part .ic { font-size: 9vmin; flex: none; }
  .dd-label { font-size: 2.4vmin; color: #8fa1b8; text-transform: uppercase; letter-spacing: 0.1em; }
  .dd-temp { font-size: 4.2vmin; font-weight: 650; margin: 0.4vmin 0; }
  .dd-temp span { font-size: 2.6vmin; font-weight: 500; color: var(--accent); margin-left: 1.4vmin; }
  .dd-text { font-size: 2.9vmin; line-height: 1.4; color: #dbe4ef; }
  body.night .dd-card { background: #0a0a0a; }
  #toast { position: fixed; left: 50%; bottom: 4vmin; transform: translateX(-50%); z-index: 60; background: #1f2937; border: 1px solid #4b5563; color: #fff; font-size: 2.6vmin; padding: 1.6vmin 2.8vmin; border-radius: 1.6vmin; opacity: 0; pointer-events: none; transition: opacity .3s; max-width: 80vw; text-align: center; }
  #toast.show { opacity: 1; }
  #updated { position: fixed; right: 2.6vmin; bottom: 0.6vmin; font-size: 1.5vmin; color: #4f5d70; }

  /* Night view (night hours, wall tablet): one big dim gray clock, tonight/tomorrow, tiles */
  #nightView { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: none; flex-direction: column; justify-content: space-between; background: #000; color: #b4b2a9; padding: 4vmin 5vmin 2.4vmin; transition: transform 1s; }
  body.nv-on #nightView { display: flex; }
  body.severe-on #nightView { display: none; }
  #nvTime { font-size: 39vmin; font-weight: 200; line-height: 0.85; letter-spacing: -0.04em; color: #c9c7bf; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #nvTime .ampm { font-size: 8vmin; font-weight: 400; color: #6f6e69; margin-left: 1.6vmin; letter-spacing: 0; }
  #nvDate { font-size: 5vmin; color: #7a7973; margin-top: 1.4vmin; }
  body.bars-on #nvTime { font-size: 33vmin; }
  body.bars-many #nvTime { font-size: 26vmin; }
  body.bars-many #nvDate { font-size: 3.6vmin; margin-top: 1vmin; }
  .nv-wx { display: grid; grid-template-columns: 1fr 1.5fr; gap: 5vmin; border-top: 1px solid #2a2a28; padding-top: 2.4vmin; }
  .nv-wx > div { min-width: 0; }
  .nv-label { font-size: 2.6vmin; letter-spacing: 0.14em; text-transform: uppercase; color: #6f6e69; }
  .nv-temp { font-size: 11vmin; font-weight: 300; color: #c9c7bf; display: flex; align-items: center; gap: 2vmin; line-height: 1.15; white-space: nowrap; }
  .nv-temp .ic { font-size: 8.5vmin; filter: grayscale(1) brightness(0.85); }
  .nv-temp span { color: #6f6e69; }
  .nv-text { font-size: 3.3vmin; color: #8a8983; margin-top: 0.4vmin; line-height: 1.3; }
  .nv-tiles { display: grid; gap: 2vmin; margin-top: 2.6vmin; }
  .nv-tile { border: 1px solid #3a3a37; border-radius: 2vmin; padding: 1.8vmin 1vmin; color: #8a8983; text-decoration: none; font-size: 2.8vmin; display: flex; align-items: center; justify-content: center; gap: 1.4vmin; white-space: nowrap; }
  .nv-tile .ic { font-size: 4.4vmin; opacity: 0.5; }
  .nv-tile:active { background: #1a1a19; }
  .nv-hint { font-size: 1.9vmin; color: #4a4a47; text-align: right; margin-top: 1vmin; }

  /* Countdown card under the tiles (shown only when something is coming up) */
  #cd { grid-area: cd; display: none; flex-direction: column; justify-content: center; padding: 1.6vmin 2.2vmin; min-width: 0; }
  body.cd-on #cd { display: flex; }
  body.cd-on .wrap { grid-template-rows: auto 1fr auto auto; grid-template-areas: "clock tiles" "now tiles" "now cd" "week week"; }

<div class="wrap" id="wrap">
  <section class="clock">
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="sun"></div>
    <div id="extras"></div>
    <div id="alerts"></div>
  </section>

  <section class="card now" id="nowCard">
    <div class="radar-hint">Radar &rsaquo;</div>
    <div>
      <div class="place" id="place"></div>
      <div class="now-top">
        <div id="nowIcon">·</div>
        <div>
          <div id="nowTemp">--</div>
        </div>
        <div>
          <div id="nowText">Loading forecast…</div>
          <div id="nowMeta"></div>
          <div id="nowRain"></div>
        </div>
      </div>
    </div>
    <div class="hourly" id="hourly"></div>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="card" id="cd"><div class="cd-h">Coming up · days to go</div><div id="cdRow"></div></section>

  <section class="card week" id="week"><div class="muted">Loading 7-day forecast…</div></section>
</div>
<div id="updated"></div>
<div id="severe"></div>
<div id="topBars"><div class="bar" id="freezeBar"></div><div class="bar" id="trashBar"></div><div class="bar" id="netBar"></div><div class="bar" id="powerBar"></div><div class="bar" id="airBar"></div></div>

<div id="nightView">
  <div class="nv-main" id="nvMain"><div id="nvTime">--:--</div><div id="nvDate"></div></div>
  <div>
    <div class="nv-wx" id="nvWx"></div>
    <div class="nv-tiles" id="nvTiles"></div>
    <div class="nv-hint">Tap the clock or weather for the full dashboard</div>
  </div>
</div>

<div id="dayDetail"><div class="dd-card" id="ddCard"></div></div>
<div id="cdDetail"><div class="dd-card cda-card" id="cdCard"></div></div>

<div id="radar">
  <div class="radar-bar">
    <div class="radar-title">Live Radar — Huntsville (KHTX)<small id="radarTime"></small></div>
    <a class="rbtn" id="radarMore" target="_top">Interactive map</a>
    <button class="rbtn close" id="radarClose">&times; Close</button>
  </div>
  <div class="radar-img"><img id="radarImg" alt="Radar loop"><div id="radarMsg"></div></div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const TZ = CONFIG.timeZone;
  const fmtTime = (d, opts) => d.toLocaleTimeString("en-US", Object.assign({ timeZone: TZ }, opts));
  $("place").textContent = CONFIG.place;
  // Wall-clock date/time in CONFIG.timeZone. Plain toLocaleString + a regex, so it also works in older
  // browsers (the fridge's) that lack formatToParts, hourCycle or Object.fromEntries.
  function tzParts(d) {
    const s = (d || new Date()).toLocaleString("en-US", { timeZone: TZ, hour12: false });
    const m = /(\d+)\D+(\d+)\D+(\d+)\D+(\d+)\D+(\d+)/.exec(s) || [];
    return { year: +m[3], month: +m[1], day: +m[2], hour: (+m[4]) % 24, minute: +m[5] };
  }
  const two = (n) => ("0" + n).slice(-2);

  /* ---------- Drawn icons (no emoji fonts needed, look the same on every device) ---------- */
  const C = { sun: "#FDB813", ray: "#FDB813", cloud: "#D5DEE8", cloud2: "#9AA9BB", rain: "#60A5FA", bolt: "#FACC15", snow: "#F1F5F9", moon: "#F3E7C4", moonDark: "#2B3646", fog: "#AEB9C7", wind: "#BFD4EA", red: "#F87171" };
  const svg = (inner) => `<span class="ic"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${inner}</svg></span>`;
  function sunG(cx, cy, r) {
    let rays = "";
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4, r1 = r * 1.35, r2 = r * 1.75;
      rays += `<line x1="${cx + r1 * Math.cos(a)}" y1="${cy + r1 * Math.sin(a)}" x2="${cx + r2 * Math.cos(a)}" y2="${cy + r2 * Math.sin(a)}" stroke="${C.ray}" stroke-width="${r * 0.32}" stroke-linecap="round"/>`;
    }
    return rays + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.sun}"/>`;
  }
  function cloudG(x, y, s, fill) {
    // a cloud whose bottom-left corner is at (x, y), width about 44*s
    return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill || C.cloud}">
      <circle cx="14" cy="-12" r="10"/><circle cx="26" cy="-18" r="13"/><circle cx="36" cy="-10" r="9"/>
      <rect x="4" y="-12" width="40" height="12" rx="6"/></g>`;
  }
  // Moon drawn from its actual age, lit side on the right while waxing (as seen from the Northern Hemisphere)
  const SYNODIC = 29.530588853;
  function moonAge(when) {
    const jd = (when ? new Date(when) : new Date()).getTime() / 86400000 + 2440587.5;
    return (((jd - 2451550.1) % SYNODIC) + SYNODIC) % SYNODIC;
  }
  function moonG(cx, cy, r, age) {
    const f = age / SYNODIC;
    const rx = Math.abs(Math.cos(2 * Math.PI * f)) * r;
    let lit;
    if (f < 0.5) { // waxing: lit on the right
      const sweep = f < 0.25 ? 0 : 1;
      lit = `M${cx} ${cy - r} A${r} ${r} 0 0 1 ${cx} ${cy + r} A${rx} ${r} 0 0 ${sweep} ${cx} ${cy - r}Z`;
    } else { // waning: lit on the left
      const sweep = f < 0.75 ? 0 : 1;
      lit = `M${cx} ${cy - r} A${r} ${r} 0 0 0 ${cx} ${cy + r} A${rx} ${r} 0 0 ${sweep} ${cx} ${cy - r}Z`;
    }
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.moonDark}" stroke="#4A5668" stroke-width="1.2"/><path d="${lit}" fill="${C.moon}"/>`;
  }
  const drops = (n, x0, y0, color) => { let d = ""; for (let i = 0; i < n; i++) d += `<line x1="${x0 + i * 10}" y1="${y0}" x2="${x0 + i * 10 - 4}" y2="${y0 + 10}" stroke="${color || C.rain}" stroke-width="3.5" stroke-linecap="round"/>`; return d; };
  const flakes = (n, x0, y0) => { let d = ""; for (let i = 0; i < n; i++) { const x = x0 + i * 11, y = y0 + (i % 2) * 6; d += `<g stroke="${C.snow}" stroke-width="2.6" stroke-linecap="round"><line x1="${x - 4}" y1="${y}" x2="${x + 4}" y2="${y}"/><line x1="${x - 2}" y1="${y - 3.5}" x2="${x + 2}" y2="${y + 3.5}"/><line x1="${x + 2}" y1="${y - 3.5}" x2="${x - 2}" y2="${y + 3.5}"/></g>`; } return d; };
  const ICONS = {
    sun: () => svg(sunG(32, 32, 12)),
    moon: (age) => svg(moonG(32, 32, 20, age)),
    partlyDay: () => svg(sunG(24, 24, 9) + cloudG(12, 52, 1.05)),
    partlyNight: (age) => svg(moonG(24, 22, 13, age) + cloudG(12, 54, 1.05)),
    cloudy: () => svg(cloudG(16, 30, 0.75, C.cloud2) + cloudG(6, 50, 1.1)),
    rain: () => svg(cloudG(8, 38, 1.1) + drops(4, 18, 44)),
    showersDay: () => svg(sunG(20, 18, 7) + cloudG(10, 38, 1.05) + drops(3, 22, 44)),
    showersNight: (age) => svg(moonG(20, 16, 10, age) + cloudG(10, 38, 1.05) + drops(3, 22, 44)),
    storm: () => svg(cloudG(8, 36, 1.1, C.cloud2) + `<path d="M34 34 L24 50 H32 L28 62 L42 44 H34 L38 34Z" fill="${C.bolt}"/>` + drops(2, 16, 42)),
    snow: () => svg(cloudG(8, 38, 1.1) + flakes(3, 20, 48)),
    sleet: () => svg(cloudG(8, 38, 1.1) + drops(2, 18, 44) + flakes(2, 41, 49)),
    fog: () => svg(cloudG(12, 30, 0.9) + [36, 44, 52].map((y, i) => `<line x1="${8 + i * 3}" y1="${y}" x2="${56 - i * 3}" y2="${y}" stroke="${C.fog}" stroke-width="3.5" stroke-linecap="round"/>`).join("")),
    wind: () => svg(`<g fill="none" stroke="${C.wind}" stroke-width="4" stroke-linecap="round"><path d="M8 24 H40 a7 7 0 1 0 -7 -7"/><path d="M8 34 H50 a7 7 0 1 1 -7 7"/><path d="M8 44 H30"/></g>`),
    tornado: () => svg(`<g stroke="${C.cloud2}" stroke-width="4" stroke-linecap="round">${[[8,56,12],[13,51,21],[18,46,30],[22,40,39],[26,36,48],[29,33,56]].map(([a,b,y]) => `<line x1="${a}" y1="${y}" x2="${b}" y2="${y}"/>`).join("")}</g>`),
    sunrise: () => svg(`<clipPath id="hz"><rect x="0" y="0" width="64" height="44"/></clipPath><g clip-path="url(#hz)">${sunG(32, 44, 11)}</g><line x1="6" y1="46" x2="58" y2="46" stroke="#E8EDF4" stroke-width="3" stroke-linecap="round"/><path d="M32 52 V62 M27 57 L32 52 L37 57" fill="none" stroke="${C.sun}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -2)"/>`),
    sunset: () => svg(`<clipPath id="hz2"><rect x="0" y="0" width="64" height="44"/></clipPath><g clip-path="url(#hz2)">${sunG(32, 44, 11)}</g><line x1="6" y1="46" x2="58" y2="46" stroke="#E8EDF4" stroke-width="3" stroke-linecap="round"/><path d="M32 50 V60 M27 55 L32 60 L37 55" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`),
    home: () => svg(`<path d="M8 30 L32 10 L56 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 27 V54 H49 V27" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/><rect x="27" y="37" width="10" height="17" rx="1.5" fill="#fff"/>`),
    camera: () => svg(`<rect x="6" y="18" width="38" height="28" rx="6" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="4.5"/><path d="M44 27 L58 19 V45 L44 37Z" fill="#fff"/><circle cx="16" cy="27" r="3.5" fill="#F87171"/>`),
    thermo: () => svg(`<rect x="24" y="6" width="16" height="38" rx="8" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="4.5"/><circle cx="32" cy="48" r="11" fill="#fff"/><rect x="29.5" y="20" width="5" height="26" rx="2.5" fill="#fff"/><g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="44" y1="14" x2="50" y2="14"/><line x1="44" y1="22" x2="50" y2="22"/><line x1="44" y1="30" x2="50" y2="30"/></g>`),
    water: () => svg(`<path d="M32 6 C24 20 14 30 14 42 a18 18 0 0 0 36 0 C50 30 40 20 32 6Z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/><path d="M23 42 a9 9 0 0 0 9 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`),
    music: () => svg(`<path d="M24 46 V14 L52 8 V40" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="17" cy="47" rx="8" ry="6.5" fill="#fff"/><ellipse cx="45" cy="41" rx="8" ry="6.5" fill="#fff"/><line x1="24" y1="22" x2="52" y2="16" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>`),
    drop: () => svg(`<path d="M32 8 C24 22 16 30 16 40 a16 16 0 0 0 32 0 C48 30 40 22 32 8Z" fill="${C.rain}"/>`),
    alert: () => svg(`<path d="M32 6 L60 56 H4Z" fill="#FBBF24" stroke="#FBBF24" stroke-width="4" stroke-linejoin="round"/><rect x="29" y="22" width="6" height="18" rx="3" fill="#3B2A05"/><circle cx="32" cy="48" r="3.6" fill="#3B2A05"/>`)
  };


  /* ---------- Tiles ---------- */
  // Open a tile's website in the Chrome app (used for Wyze, whose sign-in refuses Fully's built-in browser)
  function openInChrome(url) {
    const f = window.fully;
    const intent = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
    // Name Chrome directly so Android doesn't ask "Open with…" every time; the intent link is only a fallback
    try { if (f && typeof f.startApplication === "function") { f.startApplication("com.android.chrome", "android.intent.action.VIEW", url); return true; } } catch (e) {}
    try { if (f && typeof f.startIntent === "function") { f.startIntent(intent); return true; } } catch (e) {}
    return false; // not in Fully (fridge, a computer): just follow the link
  }
  const tilesEl = $("tiles");
  CONFIG.tiles.forEach((t) => {
    const el = document.createElement("a");
    el.className = "tile";
    el.href = t.url || "#";
    el.target = "_top";
    if (t.chrome) el.addEventListener("click", (e) => { if (openInChrome(t.url)) e.preventDefault(); });
    if (t.app) {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        if (window.fully && typeof window.fully.startApplication === "function") {
          window.fully.startApplication(t.app);
        } else {
          toast("Opening apps needs Fully Kiosk PLUS with Enable JavaScript Interface turned on.");
        }
      });
    }
    el.style.background = `linear-gradient(135deg, ${t.color} 0%, ${shade(t.color, -35)} 100%)`;
    el.innerHTML = `<div class="ti">${ICONS[t.icon] ? ICONS[t.icon]() : t.icon}</div><div><div class="tl">${t.label}</div><div class="ts">${t.sub}</div></div><div class="arrow">›</div>`;
    if (!t.app && !(t.chrome && window.fully)) el.addEventListener("click", () => el.classList.add("loading"));
    tilesEl.appendChild(el);
  });
  if (CONFIG.tiles.length >= 4) tilesEl.classList.add("grid2");
  // Clear the "Opening…" overlay if the page is restored from history
  window.addEventListener("pageshow", () => document.querySelectorAll(".tile.loading").forEach(e => e.classList.remove("loading")));

  function toast(msg) {
    let tEl = document.getElementById("toast");
    if (!tEl) { tEl = document.createElement("div"); tEl.id = "toast"; document.body.appendChild(tEl); }
    tEl.textContent = msg; tEl.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => tEl.classList.remove("show"), 5000);
  }

  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    const f = (c) => Math.max(0, Math.min(255, Math.round(c + (c * pct) / 100)));
    const r = f(n >> 16), g = f((n >> 8) & 255), b = f(n & 255);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  /* ---------- Radar overlay ---------- */
  const radar = $("radar"), rImg = $("radarImg"), rMsg = $("radarMsg");
  let radarRefresh = null, radarAutoClose = null;
  $("radarMore").href = CONFIG.radarInteractive;
  function loadRadarImg() {
    rMsg.textContent = "";
    rImg.style.display = "";
    rImg.src = CONFIG.radarLoop + "?t=" + Date.now(); // bypass cache for fresh frames
  }
  rImg.onload = () => { $("radarTime").textContent = "Updated " + fmtTime(new Date(), { hour: "numeric", minute: "2-digit" }) + " · loop of the last hour"; };
  rImg.onerror = () => { rImg.style.display = "none"; rMsg.textContent = "Radar is unavailable right now. Try the interactive map."; };
  let severeActive = false;
  let weekDays = []; // the 7-day strip's days, for the tap-for-details panel
  function openRadar() {
    if (radar.classList.contains("open")) return;
    radar.classList.add("open");
    loadRadarImg();
    radarRefresh = setInterval(loadRadarImg, 2 * 60 * 1000);
    clearTimeout(radarAutoClose);
    if (!severeActive) radarAutoClose = setTimeout(closeRadar, 5 * 60 * 1000); // back to home after 5 min (not during a warning)
  }
  function closeRadar() {
    radar.classList.remove("open");
    clearInterval(radarRefresh); clearTimeout(radarAutoClose);
    rImg.removeAttribute("src");
  }
  $("nowCard").addEventListener("click", openRadar);
  // 7-day strip: tapping a day opens its details (see showDay); tapping elsewhere on the strip still opens radar
  $("week").addEventListener("click", (e) => {
    const d = e.target.closest(".day");
    if (d && d.dataset.idx) showDay(+d.dataset.idx); else openRadar();
  });
  $("radarClose").addEventListener("click", closeRadar);

  /* ---------- Moon phase (calculated on the tablet) ---------- */
  const MOON_NAMES = ["New Moon", "Waxing Crescent", "First Quarter", "Waxing Gibbous", "Full Moon", "Waning Gibbous", "Last Quarter", "Waning Crescent"];
  function moonIndex(when) { return Math.floor((moonAge(when) / SYNODIC) * 8 + 0.5) % 8; }

  /* ---------- Sunrise / sunset (calculated on the tablet, no internet needed) ---------- */
  function sunTimes(y, m, d, lat, lon) {
    const rad = Math.PI / 180;
    const J = Date.UTC(y, m - 1, d, 12) / 86400000 + 2440587.5;
    const n = Math.round(J - 2451545.0);
    const Js = n - lon / 360;
    const M = (357.5291 + 0.98560028 * Js) % 360;
    const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
    const L = (M + C + 180 + 102.9372) % 360;
    const Jt = 2451545 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
    const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
    if (cosW > 1 || cosW < -1) return null;
    const w = Math.acos(cosW) / rad / 360;
    const toDate = (j) => new Date((j - 2440587.5) * 86400000);
    return { rise: toDate(Jt - w), set: toDate(Jt + w) };
  }
  let sunKey = "", sun = null;
  function renderSun(d) {
    const parts = tzParts(d);
    const key = `${parts.year}-${parts.month}-${parts.day}`;
    if (key !== sunKey) { sunKey = key; sun = sunTimes(+parts.year, +parts.month, +parts.day, CONFIG.lat, CONFIG.lon); }
    if (!sun) { $("sun").innerHTML = ""; return; }
    const t = (x) => fmtTime(x, { hour: "numeric", minute: "2-digit" });
    const now = d.getTime();
    $("sun").innerHTML =
      `<div class="si ${now > sun.rise ? "past" : ""}">${ICONS.sunrise()} Sunrise <b>${t(sun.rise)}</b></div>` +
      `<div class="si ${now > sun.set ? "past" : ""}">${ICONS.sunset()} Sunset <b>${t(sun.set)}</b></div>` +
      `<div class="si">${ICONS.moon(moonAge(d))} <b>${MOON_NAMES[moonIndex(d)]}</b></div>`;
  }

  /* ---------- Night view (big dim clock, tonight/tomorrow, tiles) ---------- */
  const nightOK = CONFIG.nightView === true || (CONFIG.nightView === "tablet" && !!window.fully);
  const NV_PEEK = 2 * 60 * 1000; // a tap shows the full dashboard for 2 minutes
  let nightW = null, nightPeekUntil = 0, nightWxHtml = "";
  (function buildNightTiles() {
    const box = $("nvTiles");
    box.style.gridTemplateColumns = `repeat(${CONFIG.tiles.length}, minmax(0, 1fr))`;
    CONFIG.tiles.forEach((t) => {
      const el = document.createElement("a");
      el.className = "nv-tile";
      el.href = t.url || "#";
      el.target = "_top";
      if (t.chrome) el.addEventListener("click", (e) => { if (openInChrome(t.url)) e.preventDefault(); });
      if (t.app) el.addEventListener("click", (e) => {
        e.preventDefault();
        if (window.fully && typeof window.fully.startApplication === "function") window.fully.startApplication(t.app);
      });
      el.innerHTML = `${ICONS[t.icon] ? ICONS[t.icon]() : ""}<span>${t.label}</span>`;
      box.appendChild(el);
    });
  })();
  $("nightView").addEventListener("click", (e) => {
    if (e.target.closest && e.target.closest(".nv-tile")) return;
    nightPeekUntil = Date.now() + NV_PEEK;
    document.body.classList.remove("nv-on");
  });
  // While peeking at the dashboard, every tap keeps it up a little longer
  document.addEventListener("click", () => { if (nightPeekUntil > Date.now()) nightPeekUntil = Date.now() + NV_PEEK; }, true);
  function setNightView(isNight) {
    document.body.classList.toggle("nv-on", nightOK && isNight && Date.now() >= nightPeekUntil);
  }
  function renderNightWx() {
    if (!nightOK || !nightW) return;
    const now = Date.now();
    const h = tzParts(new Date()).hour;
    const afterMidnight = h < 12;
    const hours = nightW.hourly.filter(p => new Date(p.endTime).getTime() > now);
    const daily = nightW.daily.filter(p => new Date(p.endTime).getTime() > now);
    const n = daily.find(p => !p.isDaytime);
    const di = daily.findIndex(p => p.isDaytime), dd = daily[di];
    const nn = dd ? daily.slice(di + 1).find(p => !p.isDaytime) : null;
    let left = "", right = "";
    if (afterMidnight && hours[0]) {
      const c = hours[0];
      left = `<div class="nv-label">Now</div><div class="nv-temp">${icon(c.shortForecast, c.isDaytime, c.startTime)}${c.temperature}°</div><div class="nv-text">${c.shortForecast}${n ? " · low " + n.temperature + "°" : ""}</div>`;
    } else if (n) {
      left = `<div class="nv-label">Tonight</div><div class="nv-temp">${icon(n.shortForecast, false, n.startTime)}Low ${n.temperature}°</div><div class="nv-text">${n.shortForecast}</div>`;
    }
    if (dd) {
      const v = dd.probabilityOfPrecipitation && dd.probabilityOfPrecipitation.value;
      const ymd = tzParts(new Date(dd.startTime));
      const st = sunTimes(ymd.year, ymd.month, ymd.day, CONFIG.lat, CONFIG.lon);
      const extra = (v ? ` · ${v}% chance of rain` : "") + (st ? ` · sunrise ${fmtTime(st.rise, { hour: "numeric", minute: "2-digit" })}` : "");
      right = `<div class="nv-label">${afterMidnight ? "Today" : "Tomorrow"}</div><div class="nv-temp">${icon(dd.shortForecast, true, dd.startTime)}${dd.temperature}°${nn ? ` <span>/ ${nn.temperature}°</span>` : ""}</div><div class="nv-text">${dd.shortForecast}${extra}</div>`;
    }
    const html = `<div>${left}</div><div>${right}</div>`;
    if (html !== nightWxHtml) { nightWxHtml = html; $("nvWx").innerHTML = html; }
  }

  /* ---------- Clock + night mode ---------- */
  function tick() {
    const d = new Date();
    const tp = tzParts(d), h = tp.hour;
    const ampm = h >= 12 ? "PM" : "AM";
    const h12 = h % 12 || 12;
    const m = two(tp.minute);
    $("time").innerHTML = `${h12}:${m}<span class="ampm">${ampm}</span>`;
    $("date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: TZ });
    if (nightOK) { $("nvTime").innerHTML = $("time").innerHTML; $("nvDate").textContent = $("date").textContent; }
    try { renderSun(d); } catch (e) { console.error(e); }
    const night = CONFIG.nightStart > CONFIG.nightEnd
      ? (h >= CONFIG.nightStart || h < CONFIG.nightEnd)
      : (h >= CONFIG.nightStart && h < CONFIG.nightEnd);
    document.body.classList.toggle("night", night);
    try { setNightView(night); renderNightWx(); applyBrightness(d); } catch (e) { console.error(e); }
  }

  /* ---------- Screen brightness (Fully only) ---------- */
  let brightPhase = "";
  function applyBrightness(d) {
    const f = window.fully, B = CONFIG.brightness;
    if (!f || !B || typeof f.setScreenBrightness !== "function") return;
    document.body.classList.add("hwdim");
    let phase = "day";
    if (document.body.classList.contains("night")) phase = "night";
    else if (sun && (d < sun.rise || d > sun.set)) phase = "evening";
    if (severeActive) phase = "day"; // warnings: full brightness
    if (phase === brightPhase) return; // only change at sunrise, sunset and night hours
    brightPhase = phase;
    try { f.setScreenBrightness(B[phase]); } catch (e) {}
  }
  tick();
  setInterval(tick, 1000 * 10);

  // Gentle pixel shift every 10 minutes to reduce screen burn-in
  setInterval(() => {
    const x = Math.round(Math.random() * 8 - 4), y = Math.round(Math.random() * 8 - 4);
    $("wrap").style.transform = `translate(${x}px, ${y}px)`;
    $("nightView").style.transform = `translate(${x}px, ${y}px)`;
  }, 10 * 60 * 1000);

  /* ---------- Weather (National Weather Service, free, no key) ---------- */
  function icon(text, isDay, when) {
    const s = (text || "").toLowerCase();
    const age = moonAge(when);
    if (/tornado/.test(s)) return ICONS.tornado();
    if (/thunder|t-storm|storm/.test(s)) return ICONS.storm();
    if (/snow|flurr|blizzard/.test(s)) return ICONS.snow();
    if (/sleet|ice|freezing/.test(s)) return ICONS.sleet();
    if (/rain|shower|drizzle/.test(s)) return /chance|slight|isolated|scattered/.test(s) ? (isDay ? ICONS.showersDay() : ICONS.showersNight(age)) : ICONS.rain();
    if (/fog|haze|smoke|mist/.test(s)) return ICONS.fog();
    if (/wind|breez|blustery/.test(s)) return ICONS.wind();
    if (/mostly cloudy|overcast|cloudy/.test(s) && !/partly/.test(s)) return ICONS.cloudy();
    if (/partly|mostly sunny|mostly clear/.test(s)) return isDay ? ICONS.partlyDay() : ICONS.partlyNight(age);
    if (/sunny|clear|fair/.test(s)) return isDay ? ICONS.sun() : ICONS.moon(age);
    return isDay ? ICONS.partlyDay() : ICONS.moon(age);
  }
  const pop = (p) => (p && p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value) ? `${ICONS.drop()}${p.probabilityOfPrecipitation.value}%` : "";

  async function getJSON(url) {
    const r = await fetch(url, { headers: { "Accept": "application/geo+json" } });
    if (!r.ok) throw new Error(url + " → " + r.status);
    return r.json();
  }

  // Cache: show the last forecast instantly on load, then refresh in the background
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // Small chips under sunrise/sunset. Storm risk and air quality chips were removed Nov 13 (the top banners cover alerts); the slot is kept for future chips.
  const extras = {};
  try { localStorage.removeItem("wx_risk"); localStorage.removeItem("wx_aq"); } catch (e) {}
  function renderExtras() {
    $("extras").innerHTML = Object.keys(extras).map(k => extras[k]).join("");
    document.body.classList.toggle("busy", $("extras").children.length >= 3);
  }

  // Freeze banner across the top for the next night, from the forecast already loaded
  const SNOWFLAKE = `<span class="ic"><svg viewBox="0 0 64 64"><g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"><path d="M32 6V58M9.5 19L54.5 45M9.5 45L54.5 19"/><path d="M24 10L32 18L40 10M24 54L32 46L40 54"/></g></svg></span>`;
  // Combines the forecast low with any NWS frost/freeze alert; the most serious one wins
  const COLD = { frost: 1, freeze: 2, hard: 3, pipes: 3 };
  const COLD_TIP = { frost: "cover tender plants", freeze: "cover plants, bring potted plants in", hard: "drip faucets, cover outdoor spigots", pipes: "drip faucets, open cabinets under sinks" };
  // Is today inside one of the freeze "seasons" (spring / fall)?
  function inFreezeSeason() {
    const F = CONFIG.freeze || {};
    if (!F.seasons) return true;
    const p = tzParts(new Date()), md = two(p.month) + "-" + two(p.day);
    return F.seasons.some(r => r[0] <= r[1] ? (md >= r[0] && md <= r[1]) : (md >= r[0] || md <= r[1]));
  }
  const coldOf = (ev) => /hard freeze/i.test(ev) ? "hard" : /freeze (watch|warning)/i.test(ev) ? "freeze" : /frost advisory/i.test(ev) ? "frost" : "";
  let coldNight = null, coldAlert = null;
  function showFreeze(periods) {
    coldNight = (periods || []).find(p => !p.isDaytime) || null;
    renderCold();
  }
  function setColdAlerts(feats) {
    coldAlert = feats.filter(a => coldOf(a.event)).sort((a, b) => COLD[coldOf(b.event)] - COLD[coldOf(a.event)])[0] || null;
    renderCold();
  }
  function renderCold() {
    const bar = $("freezeBar"), F = CONFIG.freeze || {}, n = coldNight;
    let fc = "";
    if (n && inFreezeSeason()) fc = n.temperature <= F.hard ? "hard" : n.temperature <= F.light ? "freeze" : "";
    if (!fc && n && F.pipes != null && n.temperature <= F.pipes) fc = "pipes"; // deep cold, any season
    const al = coldAlert ? coldOf(coldAlert.event) : "";
    const level = (COLD[al] || 0) >= (COLD[fc] || 0) ? al : fc;
    if (!level) { setBar(bar, ""); return; }
    let head;
    if (level === al) {
      const until = coldAlert.ends || coldAlert.expires;
      head = coldAlert.event.toUpperCase() + (until ? " UNTIL " + new Date(until).toLocaleString("en-US", { weekday: "short", hour: "numeric", timeZone: TZ }).toUpperCase() : "");
    } else {
      head = (level === "pipes" ? "VERY COLD " : level === "hard" ? "HARD FREEZE " : "FREEZE ") + (/^(Tonight|Overnight)$/i.test(n.name) ? "TONIGHT" : n.name.toUpperCase());
    }
    const low = n && n.temperature <= 40 ? ` · LOW ${n.temperature}°` : "";
    bar.className = "bar " + level;
    setBar(bar, `${SNOWFLAKE}${head}${low} · ${COLD_TIP[level]}`);
  }

  // Show/hide one top banner and push the page down by however tall the stack is
  function setBar(el, html) {
    if (el.innerHTML !== html) el.innerHTML = html;
    el.style.display = html ? "block" : "none";
    layoutBars();
  }
  function layoutBars() {
    const h = $("topBars").offsetHeight, on = h > 0 && !document.body.classList.contains("severe-on");
    document.body.classList.toggle("bars-on", on);
    document.body.classList.toggle("bars-many", on && [...$("topBars").children].filter(e => e.style.display === "block").length >= 2);
    $("wrap").style.paddingTop = on ? `calc(${h}px + 2.2vmin)` : "";
    $("nightView").style.paddingTop = on ? `calc(${h}px + 3vmin)` : "";
  }
  window.addEventListener("resize", layoutBars);

  // "Lost connection" banner: weather/alerts haven't updated for a while, so storm alerts can't get through
  const STALE_MIN = 30;
  let lastOk = Date.now();
  const markOk = () => { lastOk = Date.now(); checkNet(); };
  const WIFI = `<span class="ic"><svg viewBox="0 0 64 64"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M8 26a34 34 0 0 1 48 0M16 35a22 22 0 0 1 32 0M24 44a10 10 0 0 1 16 0"/><path d="M10 10L54 54"/></g></svg></span>`;
  function checkNet() {
    const stale = Date.now() - lastOk > STALE_MIN * 60 * 1000;
    setBar($("netBar"), stale ? `${WIFI}NO WEATHER UPDATES SINCE ${fmtTime(new Date(lastOk), { hour: "numeric", minute: "2-digit" })} · check Wi-Fi — storm alerts can't get through` : "");
  }

  // Unplugged banner (Fully knows the battery; falls back to the browser's battery info)
  const PLUG = `<span class="ic"><svg viewBox="0 0 64 64"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6V18M40 6V18M16 18H48V30a16 16 0 0 1-32 0Z"/><path d="M32 46V58"/></g></svg></span>`;
  let battApi = null;
  if (navigator.getBattery) navigator.getBattery().then(b => { battApi = b; checkPower(); }).catch(() => {});
  function checkPower() {
    let plugged = null, level = null;
    const f = window.fully;
    try {
      if (f && typeof f.isPlugged === "function") plugged = !!f.isPlugged();
      if (f && typeof f.getBatteryLevel === "function") level = Math.round(+f.getBatteryLevel());
    } catch (e) {}
    if (plugged === null && battApi) { plugged = battApi.charging; level = Math.round(battApi.level * 100); }
    const show = plugged === false;
    const low = show && level !== null && level <= 20;
    $("powerBar").classList.toggle("low", low);
    setBar($("powerBar"), show ? `${PLUG}NOT CHARGING${level !== null ? " · " + level + "%" : ""} · check the tablet's power cord` : "");
  }

  // Trash / recycling banner: the evening before and the morning of pickup
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const CAN = `<span class="ic"><svg viewBox="0 0 64 64"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16H54M24 16V9H40V16"/><path d="M16 16L19 56H45L48 16"/><path d="M27 26V46M37 26V46"/></g></svg></span>`;
  function trashText() {
    const list = CONFIG.pickups || [], R = CONFIG.pickupRemind || { eveningFrom: 16, morningUntil: 10 };
    if (!list.length) return "";
    const p = tzParts(new Date());
    const today = Date.UTC(p.year, p.month - 1, p.day), hr = p.hour;
    let target, when;
    if (hr >= R.eveningFrom) { target = today + 864e5; when = "tomorrow"; }
    else if (hr < R.morningUntil) { target = today; when = "today"; }
    else return "";
    const due = list.filter(x => isPickup(x, target));
    if (!due.length) return "";
    return `${CAN}${due.map(x => x.label.toUpperCase()).join(" & ")} PICKUP ${when.toUpperCase()} · ${when === "tomorrow" ? "roll it to the curb tonight" : "roll it to the curb this morning"}`;
  }
  // Federal holidays for a year, as UTC-midnight timestamps (weekend dates moved to the observed Fri/Mon)
  const holidayCache = {};
  function holidaysFor(y) {
    if (holidayCache[y]) return holidayCache[y];
    const nthDow = (m, dow, n) => { const first = new Date(Date.UTC(y, m, 1)).getUTCDay(); return Date.UTC(y, m, 1 + ((dow - first + 7) % 7) + (n - 1) * 7); };
    const lastDow = (m, dow) => { const last = new Date(Date.UTC(y, m + 1, 0)); return last.getTime() - ((last.getUTCDay() - dow + 7) % 7) * 864e5; };
    const fixed = (m, d) => { const t = Date.UTC(y, m, d), w = new Date(t).getUTCDay(); return w === 6 ? t - 864e5 : w === 0 ? t + 864e5 : t; };
    const all = {
      "New Year's Day": fixed(0, 1), "MLK Day": nthDow(0, 1, 3), "Presidents Day": nthDow(1, 1, 3), "Memorial Day": lastDow(4, 1),
      "Juneteenth": fixed(5, 19), "Independence Day": fixed(6, 4), "Labor Day": nthDow(8, 1, 1), "Columbus Day": nthDow(9, 1, 2),
      "Veterans Day": fixed(10, 11), "Thanksgiving": nthDow(10, 4, 4), "Christmas": fixed(11, 25)
    };
    return (holidayCache[y] = (CONFIG.holidays || []).map(n => all[n]).filter(Boolean));
  }
  const isHoliday = (t) => { const y = new Date(t).getUTCFullYear(); return [y - 1, y, y + 1].some(yy => holidaysFor(yy).includes(t)); };

  function isPickup(x, t) {
    const dow = new Date(t).getUTCDay(), base = DAYS.indexOf(x.day);
    if (x.nth) return dow === base && Math.ceil(new Date(t).getUTCDate() / 7) === x.nth;
    const delayed = (day) => (x.holidayDelay || []).some(d => isHoliday(t - (day - DAYS.indexOf(d)) * 864e5)); // holiday earlier that week?
    if (dow === base) return !delayed(base);
    if (dow === (base + 1) % 7) return delayed(base + 1);
    return false;
  }
  function updateTrash() { setBar($("trashBar"), trashText()); }

  let points = store.get("wx_points");
  if (points && (points.lat !== CONFIG.lat || points.lon !== CONFIG.lon)) points = null;

  function showWeather(w) {
    const now = Date.now();
    const hours = w.hourly.filter(p => new Date(p.endTime).getTime() > now); // drop hours already past
    if (!hours.length) return false;
    renderNow(hours, w.daily);
    renderWeek(w.daily);
    showFreeze(w.daily);
    nightW = w; renderNightWx();
    $("updated").textContent = "Weather updated " + fmtTime(new Date(w.at), { hour: "numeric", minute: "2-digit" });
    return true;
  }
  const cached = store.get("wx_data");
  if (cached && Date.now() - cached.at < 6 * 60 * 60 * 1000) showWeather(cached);

  async function loadWeather() {
    try {
      if (!points) {
        const p = (await getJSON(`https://api.weather.gov/points/${CONFIG.lat},${CONFIG.lon}`)).properties;
        points = { lat: CONFIG.lat, lon: CONFIG.lon, forecast: p.forecast, forecastHourly: p.forecastHourly };
        store.set("wx_points", points);
      }
      const [hourly, daily] = await Promise.all([
        getJSON(points.forecastHourly),
        getJSON(points.forecast)
      ]);
      const w = { at: Date.now(), hourly: hourly.properties.periods.slice(0, 24), daily: daily.properties.periods };
      store.set("wx_data", w);
      showWeather(w);
      markOk();
    } catch (e) {
      console.error(e);
      $("updated").textContent = "Weather unavailable — retrying soon";
      if (!$("nowTemp").dataset.ok) $("nowText").textContent = "Forecast unavailable";
    }
    if (!alertTimer) loadAlerts();
  }

  function renderNow(hours, days) {
    const h = hours[0];
    $("nowIcon").innerHTML = icon(h.shortForecast, h.isDaytime, h.startTime);
    $("nowTemp").innerHTML = `${h.temperature}<sup>°</sup>`;
    $("nowTemp").dataset.ok = "1";
    $("nowText").textContent = h.shortForecast;
    const today = days[0];
    const hiLo = today.isDaytime ? `High ${today.temperature}°` : `Low ${today.temperature}°`;
    const wind = h.windSpeed ? ` · Wind ${h.windDirection} ${h.windSpeed}` : "";
    $("nowMeta").textContent = hiLo + wind;
    try { const r = rainLine(hours); $("nowRain").className = r.wet ? "wet" : ""; $("nowRain").innerHTML = r.text ? ICONS.drop() + r.text : ""; } catch (e) { console.error(e); }
    $("hourly").innerHTML = hours.slice(1, 9).map((p) => {
      const t = fmtTime(new Date(p.startTime), { hour: "numeric" }).replace(" ", "").toLowerCase();
      return `<div class="hour"><div class="h">${t}</div><div class="i">${icon(p.shortForecast, p.isDaytime, p.startTime)}</div><div class="t">${p.temperature}°</div><div class="p">${pop(p)}</div></div>`;
    }).join("");
  }

  // One line under current conditions: when rain starts or stops in the next few hours
  function rainLine(hours) {
    const R = CONFIG.rainLine;
    if (!R || !hours.length) return {};
    const ahead = hours.slice(0, R.hoursAhead || 12);
    const chance = (p) => (p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value) || 0;
    const wet = (p) => chance(p) >= R.chance;
    const kind = (p) => { const s = (p.shortForecast || "").toLowerCase(); return /thunder|storm/.test(s) ? "Storms" : /snow|flurr/.test(s) ? "Snow" : /sleet|freezing|ice/.test(s) ? "Wintry mix" : "Rain"; };
    const at = (p) => fmtTime(new Date(p.startTime), { hour: "numeric" });
    if (wet(hours[0])) {
      let stop = -1;
      for (let i = 1; i < hours.length; i++) if (!wet(hours[i])) { stop = i; break; }
      return { wet: true, text: stop < 0 ? `${kind(hours[0])} likely for the next ${hours.length}+ hours` : `${kind(hours[0])} ending around ${at(hours[stop])}` };
    }
    const first = ahead.filter(wet)[0];
    if (first) return { wet: true, text: `${kind(first)} likely starting around ${at(first)}` };
    const max = ahead.reduce((m, p) => chance(p) > chance(m) ? p : m, ahead[0]);
    if (chance(max) >= 20) return { text: `Mostly dry · ${chance(max)}% chance of ${kind(max).toLowerCase()} around ${at(max)}` };
    return { text: `Dry for the next ${ahead.length} hours` };
  }

  function renderWeek(periods) {
    // Pair day + night periods into one column per day
    const days = [];
    for (let i = 0; i < periods.length; i++) {
      const p = periods[i];
      if (p.isDaytime) {
        const n = periods[i + 1] && !periods[i + 1].isDaytime ? periods[i + 1] : null;
        days.push({ name: p.name, day: p, night: n });
        if (n) i++;
      } else if (i === 0) {
        days.push({ name: "Tonight", day: null, night: p });
      }
    }
    weekDays = days.slice(0, 7);
    $("week").innerHTML = days.slice(0, 7).map((d, idx) => {
      const main = d.day || d.night;
      let name = d.name;
      if (/^(Today|This Afternoon|Tonight|Overnight)$/i.test(name)) name = d.day ? "Today" : "Tonight";
      else {
        const dt = new Date(main.startTime); // holidays like "Veterans Day" still show the weekday
        name = isNaN(dt) ? name.slice(0, 3) : dt.toLocaleDateString("en-US", { weekday: "short", timeZone: TZ });
      }
      const hi = d.day ? `${d.day.temperature}°` : "";
      const lo = d.night ? `<span>${d.night.temperature}°</span>` : "";
      d.label = name;
      return `<div class="day ${idx === 0 ? "today" : ""}" data-idx="${idx}"><div class="d">${name}</div><div class="i">${icon(main.shortForecast, !!d.day, main.startTime)}</div><div class="t">${hi}${lo}</div><div class="p">${pop(main)}</div></div>`;
    }).join("");
  }

  /* ---------- Day details panel ---------- */
  let ddTimer = null;
  const esc = (s) => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function showDay(i) {
    const d = weekDays[i];
    if (!d) return;
    const main = d.day || d.night;
    const dt = new Date(main.startTime);
    const dateTxt = isNaN(dt) ? "" : dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: TZ });
    const part = (p, label) => {
      if (!p) return "";
      const rain = p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value ? `<span>${p.probabilityOfPrecipitation.value}% chance of rain</span>` : "";
      return `<div class="dd-part">${icon(p.shortForecast, p.isDaytime, p.startTime)}<div>
        <div class="dd-label">${esc(label)}</div>
        <div class="dd-temp">${p.isDaytime ? "High" : "Low"} ${p.temperature}°${rain}</div>
        <div class="dd-text">${esc(p.detailedForecast || p.shortForecast)}</div></div></div>`;
    };
    const dayName = d.day ? d.day.name : "";
    $("ddCard").innerHTML = `<div class="dd-head"><div class="dd-title">${esc(dateTxt || d.label)}</div>
        <button class="rbtn" id="ddRadar">Radar</button><button class="rbtn close" id="ddClose">&times; Close</button></div>
      ${part(d.day, /^(Today|This Afternoon)$/i.test(dayName) ? dayName : "Day")}${part(d.night, d.night && /^(Tonight|Overnight)$/i.test(d.night.name) ? d.night.name : "Night")}`;
    $("dayDetail").classList.add("open");
    $("ddClose").onclick = closeDay;
    $("ddRadar").onclick = () => { closeDay(); openRadar(); };
    clearTimeout(ddTimer); ddTimer = setTimeout(closeDay, 60 * 1000); // back to home after a minute
  }
  function closeDay() { $("dayDetail").classList.remove("open"); clearTimeout(ddTimer); }
  $("dayDetail").addEventListener("click", (e) => { if (e.target.id === "dayDetail") closeDay(); }); // tap outside the card to close

  /* ---------- Severe weather wake-up ---------- */
  function wakeScreen() {
    const f = window.fully;
    if (!f) return;
    try { if (typeof f.bringToForeground === "function") f.bringToForeground(); } catch (e) {} // e.g. Chrome is open on the Wyze tile
    try { if (typeof f.stopScreensaver === "function") f.stopScreensaver(); } catch (e) {}
    try { if (typeof f.turnScreenOn === "function") f.turnScreenOn(); } catch (e) {}
  }
  let alertTimer = null;
  function scheduleAlerts(ms) { clearTimeout(alertTimer); alertTimer = setTimeout(loadAlerts, ms); }

  function handleSevere(feats) {
    const now = Date.now();
    const rules = CONFIG.wakeAlerts || {};
    const active = feats.filter(a => rules[a.event] && (!a.ends && !a.expires || new Date(a.ends || a.expires).getTime() > now));
    const keepOn = active.filter(a => rules[a.event] === "keepOn");
    const seen = store.get("wx_seen_alerts") || {};
    const isNew = active.filter(a => !seen[a.id]);
    active.forEach(a => { seen[a.id] = new Date(a.ends || a.expires || now + 864e5).getTime(); });
    Object.keys(seen).forEach(id => { if (seen[id] < now - 864e5) delete seen[id]; }); // forget old alerts
    store.set("wx_seen_alerts", seen);

    const banner = $("severe");
    if (!active.length) {
      if (severeActive && radar.classList.contains("open")) { clearTimeout(radarAutoClose); radarAutoClose = setTimeout(closeRadar, 5 * 60 * 1000); }
      if (severeActive) { severeActive = false; applyBrightness(new Date()); }
      banner.style.display = "none"; document.body.classList.remove("severe-on"); layoutBars();
      return 5 * 60 * 1000; // normal: check every 5 minutes
    }
    const rank = (a) => /tornado warning/i.test(a.event) ? 0 : 1;   // a tornado warning outranks a thunderstorm warning
    const top = keepOn.slice().sort((a, b) => rank(a) - rank(b))[0] || active[0];
    const until = top.ends || top.expires;
    const untilTxt = until ? "until " + new Date(until).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: TZ }) : "";
    banner.className = /tornado warning/i.test(top.event) ? "tornado" : /thunderstorm warning/i.test(top.event) ? "tstorm" : "watch";
    banner.innerHTML = `${ICONS.alert()} ${top.event.toUpperCase()} ${untilTxt}<small>${(top.areaDesc || "").split(";").slice(0, 3).join(" · ")}</small>`;
    banner.style.display = "block"; document.body.classList.add("severe-on"); layoutBars();

    severeActive = keepOn.length > 0;
    applyBrightness(new Date());
    if (keepOn.length) { closeDay(); wakeScreen(); openRadar(); }       // warnings: keep the screen on and radar open
    else if (isNew.length) { closeDay(); wakeScreen(); openRadar(); }    // watches: wake once when issued
    return keepOn.length ? 60 * 1000 : 2 * 60 * 1000;        // check more often during a watch or warning
  }

  async function loadAlerts() {
    let next = 5 * 60 * 1000;
    try {
      const data = await getJSON(`https://api.weather.gov/alerts/active?point=${CONFIG.lat},${CONFIG.lon}`);
      const feats = (data.features || []).map(f => f.properties);
      next = handleSevere(feats);
      setColdAlerts(feats);
      markOk();
      const box = $("alerts"), listed = feats.filter(a => !coldOf(a.event)); // frost/freeze alerts show as the top banner instead
      if (!listed.length) { box.style.display = "none"; box.innerHTML = ""; }
      else {
      box.style.display = "block";
      box.innerHTML = listed.slice(0, 3).map((a) => {
        const sev = (a.severity || "").toLowerCase();
        const cls = sev === "extreme" || sev === "severe" ? "" : sev === "moderate" ? "moderate" : "minor";
        const until = a.ends || a.expires;
        const untilTxt = until ? " until " + new Date(until).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: TZ }) : "";
        return `<div class="alert ${cls}">${ICONS.alert()} ${a.event}${untilTxt}</div>`;
      }).join("");
      }
    } catch (e) { console.error(e); next = 2 * 60 * 1000; }
    scheduleAlerts(next);
  }
  // Check right away whenever the screen comes back on
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAlerts(); });

  /* ---------- Countdowns (card under the tiles) ---------- */
  const CD_THEME = { "New Year's Day": "newyear", "Valentine's Day": "valentine", "Easter": "easter", "Mother's Day": "mom", "Father's Day": "dad", "Independence Day": "july4", "Thanksgiving": "thanks", "Christmas": "xmas" };
  const PARTY = `<span class="ic"><svg viewBox="0 0 64 64"><path d="M10 56 L26 14 L50 38Z" fill="#fbd38d"/><path d="M26 14 L50 38" stroke="#f687b3" stroke-width="4"/><circle cx="44" cy="12" r="3" fill="#90cdf4"/><circle cx="54" cy="24" r="2.5" fill="#90cdf4"/><circle cx="36" cy="6" r="2.5" fill="#68d391"/><circle cx="56" cy="8" r="2" fill="#f687b3"/></svg></span>`;
  function nthWeekday(y, m, dow, n) { const first = new Date(Date.UTC(y, m, 1)).getUTCDay(); return Date.UTC(y, m, 1 + ((dow - first + 7) % 7) + (n - 1) * 7); }
  function easterDay(y) { // Gregorian computus
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return Date.UTC(y, month - 1, day);
  }
  function holidayDay(name, y) {
    switch (name) {
      case "New Year's Day": return Date.UTC(y, 0, 1);
      case "Valentine's Day": return Date.UTC(y, 1, 14);
      case "Easter": return easterDay(y);
      case "Mother's Day": return nthWeekday(y, 4, 0, 2);
      case "Father's Day": return nthWeekday(y, 5, 0, 3);
      case "Independence Day": return Date.UTC(y, 6, 4);
      case "Thanksgiving": return nthWeekday(y, 10, 4, 4);
      case "Christmas": return Date.UTC(y, 11, 25);
    }
    return null;
  }
  function countdownItems(opts) {
    const C = CONFIG.countdowns;
    if (!C) return [];
    opts = opts || {};
    const ahead = opts.daysAhead || C.daysAhead || 60;
    const p = tzParts(new Date()), today = Date.UTC(p.year, p.month - 1, p.day), list = [];
    const add = (name, t, theme, what) => { const d = Math.round((t - today) / 864e5); if (d >= 0 && d <= ahead) list.push({ name: name, t: t, d: d, theme: theme, what: what }); };
    [p.year, p.year + 1].forEach((y) => {
      (C.holidays || []).forEach((h) => { const t = holidayDay(h, y); if (t !== null) add(h, t, CD_THEME[h] || "event"); });
      (C.events || []).forEach((e) => {
        const m = /^(?:(\d{4})-)?(\d{1,2})-(\d{1,2})$/.exec(e.date || "");
        if (!m || (m[1] && +m[1] !== y)) return;
        add(e.name, Date.UTC(y, +m[2] - 1, +m[3]), e.theme || "event", e.what);
      });
    });
    list.sort((a, b) => a.d - b.d);
    return opts.all ? list : list.slice(0, C.show || 3);
  }
  let cdHtml = null;
  function renderCountdowns() {
    const items = countdownItems();
    const html = items.map((it) => {
      const when = it.d === 0 ? "Today!" : it.d === 1 ? "Tomorrow" : new Date(it.t).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
      return `<div class="cdi cd-${it.theme}${it.d === 0 ? " today" : ""}" title="${esc((it.what ? it.what + " · " : "") + it.name)}"><div class="cdn">${it.d === 0 ? PARTY : it.d}</div><div class="cdt"><div class="cdl">${esc(it.name)}</div><div class="cdd">${when}</div></div></div>`;
    }).join("");
    if (html === cdHtml) return;
    cdHtml = html;
    $("cdRow").innerHTML = html;
    $("cdRow").style.gridTemplateColumns = `repeat(${Math.max(items.length, 1)}, minmax(0, 1fr))`;
    document.body.classList.toggle("cd-on", items.length > 0);
  }
  try { renderCountdowns(); } catch (e) { console.error(e); }

  // Tap the countdown card: every holiday and family date for the next 12 months
  let cdTimer = null;
  function showAllCountdowns() {
    const items = countdownItems({ all: true, daysAhead: 364 }); // one year, without today's event showing twice
    let month = "";
    const html = items.map((it) => {
      const dt = new Date(it.t);
      const m = dt.toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
      const head = m !== month ? `<div class="cda-month">${m}</div>` : "";
      month = m;
      const when = dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
      const big = it.d === 0 ? PARTY : `${it.d}<small>${it.d === 1 ? "day" : "days"}</small>`;
      return `${head}<div class="cdi cda cd-${it.theme}${it.d === 0 ? " today" : ""}"><div class="cdn">${big}</div><div class="cdt"><div class="cdl">${esc(it.name)}</div><div class="cdd">${it.what && it.what !== "Birthday" ? esc(it.what) + " · " : ""}${it.d === 0 ? "Today!" : it.d === 1 ? "Tomorrow · " + when : when}</div></div></div>`;
    }).join("") || `<div class="muted">Nothing on the calendar in the next 12 months.</div>`;
    $("cdCard").innerHTML = `<div class="dd-head"><div class="dd-title">Coming up this year</div><button class="rbtn close" id="cdClose">&times; Close</button></div><div class="cda-list">${html}</div>`;
    $("cdDetail").classList.add("open");
    $("cdClose").onclick = closeAllCountdowns;
    clearTimeout(cdTimer); cdTimer = setTimeout(closeAllCountdowns, 90 * 1000); // back to home after 90 seconds
  }
  function closeAllCountdowns() { $("cdDetail").classList.remove("open"); clearTimeout(cdTimer); }
  $("cd").addEventListener("click", showAllCountdowns);
  $("cdDetail").addEventListener("click", (e) => { if (e.target.id === "cdDetail") closeAllCountdowns(); });
  setInterval(() => { try { renderCountdowns(); } catch (e) {} }, 5 * 60 * 1000);

  /* ---------- Air quality banner (Open-Meteo US AQI, free, no key) — only when the air is actually bad ---------- */
  const SMOKE = `<span class="ic"><svg viewBox="0 0 64 64"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M8 22h30a8 8 0 1 0-8-8"/><path d="M8 34h44a8 8 0 1 1-8 8"/><path d="M8 46h22"/></g></svg></span>`;
  const AIR = [[150, "UNHEALTHY FOR SENSITIVE GROUPS", "sensitive groups should limit time outdoors"], [200, "UNHEALTHY", "limit time outdoors"], [300, "VERY UNHEALTHY", "stay indoors, keep windows closed"], [1e9, "HAZARDOUS", "stay indoors, keep windows closed"]];
  async function loadAir() {
    const min = CONFIG.airBanner;
    if (min == null) { setBar($("airBar"), ""); return; }
    try {
      const d = await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current=us_aqi`);
      const v = d.current ? d.current.us_aqi : null;
      if (v == null || v < min) { setBar($("airBar"), ""); return; }
      const lvl = AIR.filter(a => v <= a[0])[0];
      $("airBar").classList.toggle("bad", v > 150);
      setBar($("airBar"), `${SMOKE}AIR QUALITY: ${lvl[1]} · AQI ${Math.round(v)} · ${lvl[2]}`);
    } catch (e) { console.error(e); }
  }
  setTimeout(loadAir, 400);
  setInterval(loadAir, 30 * 60 * 1000); // every 30 min

  /* ---------- Periodic checks ---------- */
  renderExtras();
  updateTrash();
  checkPower();
  setInterval(() => { updateTrash(); checkNet(); checkPower(); }, 60 * 1000);


  setTimeout(loadWeather, 50); // let the clock and tiles paint first
  setInterval(loadWeather, 15 * 60 * 1000);            // weather every 15 min
  // alerts: checked on load, then every 5 min (every 1–2 min during a watch or warning)
  // Full refresh every 6 hours — but only while the internet is working, so a reload never lands on an error page
  setTimeout(function refresh() {
    if (navigator.onLine !== false && Date.now() - lastOk < 10 * 60 * 1000) location.reload();
    else setTimeout(refresh, 10 * 60 * 1000);
  }, 6 * 60 * 60 * 1000);
})();
</script>
